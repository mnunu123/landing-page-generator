<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw 퀀트 API — 사전예약</title>
  <meta name="description" content="BTC/USDT 전처리 완료 퀀트 데이터 API. 월 40,000원으로 시작하세요." />

  <!-- ① GA4 — G-XXXXXXXXXX 를 실제 측정 ID로 교체 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── CSS 변수 (JS가 variant에 따라 덮어씀) ── */
    :root {
      --btn-color:        #00D4FF;
      --btn-hover:        #1ae8ff;
      --btn-shadow:       rgba(0, 212, 255, 0.45);
      --btn-shadow-hover: rgba(0, 212, 255, 0.70);
      --modal-border:     rgba(0, 212, 255, 0.30);
      --modal-badge-bg:   rgba(0, 212, 255, 0.12);
      --modal-badge-bdr:  rgba(0, 212, 255, 0.35);
      --input-focus:      rgba(0, 212, 255, 0.55);
    }

    body {
      background: #08090e;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    }

    /* ── 랜딩 컨테이너 ──────────────────────── */
    #lp-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    #lp-img {
      display: block;
      width: 100%;
      height: auto;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #555;
      font-size: 14px;
    }

    /* ── CTA 배경 마스크 (Gemini 잔상 제거) ───── */
    /* 버튼 뒤 넓은 영역을 어두운 배경색으로 덮어 반투명 사각형을 숨김 */
    .cta-mask {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    /* ── CTA 버튼 ────────────────────────────── */
    .cta-btn {
      z-index: 2;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--btn-color);
      color: #000;
      font-weight: 800;
      font-size: clamp(13px, 1.4vw, 17px);
      font-family: inherit;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      letter-spacing: -0.02em;
      white-space: nowrap;
      min-height: 44px;
      box-shadow: 0 0 24px var(--btn-shadow), 0 4px 16px rgba(0,0,0,0.4);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .cta-btn:hover {
      background: var(--btn-hover);
      transform: scale(1.025);
      box-shadow: 0 0 40px var(--btn-shadow-hover), 0 4px 20px rgba(0,0,0,0.4);
    }

    .cta-btn:active { transform: scale(0.98); }

    /* ── Formspree 모달 ──────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #modal-overlay.open { display: flex; }

    #modal-box {
      background: #0d1828;
      border: 1px solid var(--modal-border);
      border-radius: 18px;
      padding: 40px 36px 32px;
      width: min(460px, 92vw);
      position: relative;
      box-shadow: 0 0 70px var(--modal-badge-bg), 0 20px 60px rgba(0,0,0,0.6);
      animation: modal-in 0.22s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.94) translateY(12px); }
      to   { opacity: 1; transform: scale(1)    translateY(0);    }
    }

    #modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: #667;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.1s;
    }
    #modal-close:hover { color: #ccc; }

    #modal-badge {
      display: inline-block;
      background: var(--modal-badge-bg);
      border: 1px solid var(--modal-badge-bdr);
      color: var(--btn-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 18px;
    }

    #modal-title {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    #modal-sub {
      color: #7a8898;
      font-size: 14px;
      margin-bottom: 28px;
    }

    #reserve-form input[type="text"],
    #reserve-form input[type="email"] {
      display: block;
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 9px;
      color: #e8edf2;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    #reserve-form input:focus {
      border-color: var(--input-focus);
    }
    #reserve-form input::placeholder { color: #445; }

    #form-submit {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--btn-color);
      color: #000;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
      letter-spacing: -0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    #form-submit:hover { background: var(--btn-hover); transform: scale(1.01); }
    #form-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    #form-success {
      display: none;
      text-align: center;
      color: #00FF7F;
      font-size: 18px;
      font-weight: 700;
      padding: 24px 0 8px;
      line-height: 1.6;
    }
    #form-success small { color: #7a8898; font-weight: 400; font-size: 14px; }

    #modal-disclaimer {
      color: #4a5568;
      font-size: 11px;
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- ① 랜딩 컨테이너 (PNG + CTA 버튼 오버레이) -->
<div id="lp-container">
  <div id="loading">이미지 로딩 중...</div>
  <img id="lp-img" alt="OpenClaw 퀀트 API 상세페이지" style="display:none;" />
  <!-- CTA 버튼은 JS가 cta_slots.json을 읽어 동적으로 주입 -->
</div>

<!-- ② Formspree 신청 모달 -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-box">
    <button id="modal-close" aria-label="닫기">&times;</button>

    <p id="modal-badge">사전예약 한정</p>
    <h2 id="modal-title">지금 사전예약하기</h2>
    <p id="modal-sub">월 40,000원 · 언제든 취소 가능</p>

    <!--
      Formspree action URL: https://formspree.io/f/REPLACE_ME
      실제 Form ID로 교체 후 배포하세요.
    -->
    <form id="reserve-form"
          action="https://formspree.io/f/REPLACE_ME"
          method="POST">
      <input type="text"  name="name"   placeholder="이름" required autocomplete="name" />
      <input type="email" name="email"  placeholder="이메일" required autocomplete="email" />
      <input type="hidden" name="_subject" value="OpenClaw 사전예약 신청" />
      <input type="hidden" id="form-ab-var"   name="ab_variant"  value="" />
      <input type="hidden" id="form-cta-from" name="cta_from"    value="" />
      <button type="submit" id="form-submit">신청하기 →</button>
    </form>

    <div id="form-success">
      신청이 완료되었습니다! 🎉<br>
      <small>확인 이메일을 보내드릴게요.</small>
    </div>

    <p id="modal-disclaimer">
      * 사전예약은 구매 확정이 아닙니다.<br>
      목표 인원 미달 시 전액 미청구됩니다.
    </p>
  </div>
</div>

<script>
/* ────────────────────────────────────────────
   설정 — 배포 전 실제 값으로 교체하세요
──────────────────────────────────────────── */
var CONFIG = {
  GA4_ID:      'G-XXXXXXXXXX',   // 실제 GA4 측정 ID
  EXP_ID:      'openclaw_v3v4',  // 실험 식별자
  PAGE_ID:     'openclaw',       // 페이지 식별자
  COOKIE_DAYS: 30,
  STORAGE_KEY: 'oc_ab_var',
};

/* ── 유틸: 쿠키 ────────────────────────────── */
function getCookie(name) {
  var c = document.cookie.split(';').map(function(s) { return s.trim(); })
    .find(function(s) { return s.startsWith(name + '='); });
  return c ? c.split('=')[1] : null;
}

function setCookie(name, val, days) {
  var exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = name + '=' + val + ';expires=' + exp + ';path=/;SameSite=Lax';
}

/* ── A/B 할당
   우선순위: URL ?var= > localStorage > cookie > 랜덤 신규
──────────────────────────────────────────── */
function resolveVariant() {
  var p = new URLSearchParams(location.search).get('var');
  if (p === 'A' || p === 'B') { persistVariant(p); return p; }

  var s = localStorage.getItem(CONFIG.STORAGE_KEY) || getCookie(CONFIG.STORAGE_KEY);
  if (s === 'A' || s === 'B') return s;

  var v = Math.random() < 0.5 ? 'A' : 'B';
  persistVariant(v);
  return v;
}

function persistVariant(v) {
  localStorage.setItem(CONFIG.STORAGE_KEY, v);
  setCookie(CONFIG.STORAGE_KEY, v, CONFIG.COOKIE_DAYS);
}

/* ── GA4 이벤트 전송
   항상 exp_id / var / page_id 공통 파라미터 포함
──────────────────────────────────────────── */
function sendGA4(eventName, extra) {
  var params = Object.assign(
    { exp_id: CONFIG.EXP_ID, var: VARIANT, page_id: CONFIG.PAGE_ID },
    extra || {}
  );
  console.log('[GA4] sent', eventName, params);
  if (typeof gtag === 'function') gtag('event', eventName, params);
}

/* ── 모달 열기/닫기 ────────────────────────── */
function openModal(ga4Data, ctaId) {
  // 히든 필드 채우기
  document.getElementById('form-ab-var').value   = VARIANT;
  document.getElementById('form-cta-from').value = ctaId || '';

  // 폼 초기화 (이미 성공한 경우 리셋)
  var form    = document.getElementById('reserve-form');
  var success = document.getElementById('form-success');
  if (success.style.display !== 'none') {
    form.reset();
    form.style.display    = '';
    success.style.display = 'none';
    document.getElementById('form-submit').disabled = false;
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // GA4: CTA 클릭
  sendGA4('lp_cta_click', {
    cta_id:     ga4Data ? ga4Data.cta_id     : ctaId,
    section_id: ga4Data ? ga4Data.section_id : '',
  });
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── hex → rgba 변환 헬퍼 ───────────────────── */
function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/* ── variant 색상을 CSS 변수로 주입 ────────────
   A: cyan(#00D4FF) / B: neon green(#00FF7F)
──────────────────────────────────────────── */
function applyVariantColors(cfg) {
  if (!cfg || !cfg.btn_color) return;
  var root = document.documentElement;
  var c    = cfg.btn_color;
  root.style.setProperty('--btn-color',        cfg.btn_color        || '#00D4FF');
  root.style.setProperty('--btn-hover',        cfg.btn_hover        || '#1ae8ff');
  root.style.setProperty('--btn-shadow',       cfg.btn_shadow       || hexToRgba(c, 0.45));
  root.style.setProperty('--btn-shadow-hover', cfg.btn_shadow_hover || hexToRgba(c, 0.70));
  root.style.setProperty('--modal-border',     hexToRgba(c, 0.30));
  root.style.setProperty('--modal-badge-bg',   hexToRgba(c, 0.12));
  root.style.setProperty('--modal-badge-bdr',  hexToRgba(c, 0.35));
  root.style.setProperty('--input-focus',      hexToRgba(c, 0.55));
}

/* ── CTA 버튼 렌더링
   cta_slots.json 의 각 슬롯을 position:absolute <button> 으로 변환
   left / top / width 는 % 단위 → 화면 크기 무관하게 정확한 위치
──────────────────────────────────────────── */
function renderCTAButtons(slots) {
  var container = document.getElementById('lp-container');

  slots.forEach(function(slot) {
    // ── 배경 마스크: Gemini가 그린 반투명 사각형/잔상을 덮어 숨김
    if (slot.mask) {
      var m = slot.mask;
      var mask = document.createElement('div');
      mask.className      = 'cta-mask';
      mask.style.left     = m.left_pct   + '%';
      mask.style.top      = m.top_pct    + '%';
      mask.style.width    = m.width_pct  + '%';
      mask.style.height   = m.height_pct + '%';
      mask.style.background = m.color || '#0A0F1E';
      container.appendChild(mask);
    }

    // ── 실제 클릭 가능한 CTA 버튼
    var btn = document.createElement('button');
    btn.className   = 'cta-btn';
    btn.textContent = slot.label || '지금 신청하기';
    btn.setAttribute('data-slot-id', slot.id);
    btn.setAttribute('type', 'button');

    btn.style.left  = slot.left_pct  + '%';
    btn.style.top   = slot.top_pct   + '%';
    btn.style.width = slot.width_pct + '%';

    btn.addEventListener('click', function() {
      openModal(slot.ga4 || null, slot.id);
    });

    container.appendChild(btn);
  });
}

/* ── Formspree 비동기 제출 ──────────────────── */
document.getElementById('reserve-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var form   = this;
  var submit = document.getElementById('form-submit');
  submit.disabled   = true;
  submit.textContent = '전송 중...';

  fetch(form.action, {
    method:  'POST',
    body:    new FormData(form),
    headers: { 'Accept': 'application/json' },
  })
  .then(function(res) {
    if (res.ok) {
      form.style.display = 'none';
      document.getElementById('form-success').style.display = 'block';

      // GA4: 신청 완료
      sendGA4('lp_reserve_submit', {
        plan:  'monthly',
        price: 40000,
      });
    } else {
      return res.json().then(function(data) {
        submit.disabled   = false;
        submit.textContent = '신청하기 →';
        var msg = (data.errors || []).map(function(e) { return e.message; }).join(', ')
                  || '오류가 발생했습니다. 다시 시도해주세요.';
        alert(msg);
      });
    }
  })
  .catch(function() {
    submit.disabled   = false;
    submit.textContent = '신청하기 →';
    alert('네트워크 오류가 발생했습니다. 다시 시도해주세요.');
  });
});

/* ── 모달 닫기 이벤트 ────────────────────────── */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('modal-close').addEventListener('click', closeModal);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

/* ── 메인 초기화 ────────────────────────────── */
var VARIANT = resolveVariant();

var img     = document.getElementById('lp-img');
var loading = document.getElementById('loading');

// A/B 변형 PNG 로드
img.src = 'images/final_page_' + VARIANT + '.png';
img.addEventListener('load',  function() { loading.style.display = 'none'; img.style.display = 'block'; });
img.addEventListener('error', function() { loading.textContent = '[' + VARIANT + '] 이미지를 불러올 수 없습니다.'; });

// cta_slots.json 로드 → variant 색 적용 → 버튼 렌더링 → impression 이벤트
fetch('cta_slots.json')
  .then(function(r) {
    if (!r.ok) throw new Error('cta_slots.json fetch failed: ' + r.status);
    return r.json();
  })
  .then(function(data) {
    // variant_slots 구조 우선 사용 (신규 포맷)
    // 구 포맷(data.slots)도 폴백으로 지원
    var variantCfg = (data.variant_slots || {})[VARIANT] || {};
    applyVariantColors(variantCfg);
    renderCTAButtons(variantCfg.slots || data.slots || []);
    sendGA4('lp_impression', {});
  })
  .catch(function(err) { console.error('[cta_slots] 로드 실패:', err); });
</script>
</body>
</html>
